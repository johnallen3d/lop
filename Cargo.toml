[package]
name = "lop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Conservative cleanup of stale Git worktrees"
license = "MIT"
repository = "https://github.com/johnallen3d/lop"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"
